# Site settings
title: "Jared Lincenberg"
email: jaredlincenberg@gmail.com
description: >-
  Interested in nature and programming.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://jaredlincenberg.github.io" # the base hostname & protocol for your site

# Author / social links
github_username:  jaredlincenberg
linkedin_username: jared-lincenberg

# Build settings
plugins:
  - jekyll-feed

collections:
  field_notes:
    output: true
    permalink: /field-notes/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: entry
      eyebrow: "~/writing"
      back_url: "/writing/"
      back_label: "Back to writing"
      article_wide: true
  - scope:
      path: ""
      type: "field_notes"
    values:
      layout: entry
      eyebrow: "~/field-notes"
      back_url: "/field-notes/"
      back_label: "Back to field notes"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
