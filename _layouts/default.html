<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% elsif site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script>
(function () {
  var stored = localStorage.getItem('theme');
  var theme = stored || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
</head>
<body>
<header class="site-header">
  <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
  <nav class="site-nav">
    <a href="{{ '/work/' | relative_url }}"{% if page.url contains '/work' %} class="active"{% endif %}>Work</a>
    <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing' or page.layout == 'post' %} class="active"{% endif %}>Writing</a>
    <a href="{{ '/field-notes/' | relative_url }}"{% if page.url contains '/field-notes' %} class="active"{% endif %}>Field Notes</a>
    <a href="{{ '/photos/' | relative_url }}"{% if page.url contains '/photos' %} class="active"{% endif %}>Photos</a>
    <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} class="active"{% endif %}>About</a>
  </nav>
  <div class="theme-toggle-wrap">
    <span class="theme-toggle-label" data-theme-label="light">Light</span>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode"><span class="knob"></span></button>
    <span class="theme-toggle-label" data-theme-label="dark">Dark</span>
  </div>
</header>

<main>
{{ content }}
</main>

<footer class="site-footer">
  <span>&copy; 2026 {{ site.title }}</span>
  <div class="footer-links">
    <a href="https://github.com/{{ site.github_username }}">GitHub</a>
    <a href="https://www.inaturalist.org/people/jared_lincenberg">iNaturalist</a>
    <a href="mailto:{{ site.email }}">Contact</a>
  </div>
</footer>

<script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</body>
</html>
